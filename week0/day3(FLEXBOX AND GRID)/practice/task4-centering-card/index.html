<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Card (Flexbox & Grid)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==============================================
       OUTER CONTAINER (The Centering Parent)
       This container will be given 100vh (full screen height)
       to center the card both horizontally and vertically.
       ============================================== -->
  <main class="container">

    <!-- THE CARD (The Centered Child) -->
    <div class="card">
      <h2>Welcome Card</h2>
      <p>This card is centered horizontally and vertically on the page.</p>
      <button type="button">Explore More</button>
    </div>

  </main>

</body>
</html>
