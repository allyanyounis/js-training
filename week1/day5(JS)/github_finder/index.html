<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub User Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-card">
    <header>
      <h1>GitHub Finder</h1>
      <p>Search any GitHub user to view profile details and recent repositories</p>
    </header>

    <!-- Search Form (with preventDefault in JS) -->
    <form id="searchForm" class="search-form">
      <input 
        type="text" 
        id="usernameInput" 
        placeholder="Enter GitHub username (e.g. torvalds)..." 
        autofocus 
        required 
      />
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <!-- Status Messages (Loading, 404, or Errors) -->
    <div id="statusMessage" class="status-message"></div>

    <!-- User Profile Card -->
    <div id="profileContainer" class="profile-container"></div>

    <!-- 5 Recent Repositories -->
    <div id="reposContainer" class="repos-container"></div>
  </div>

<script type="module" src="js/app.js"></script>
</body>
</html>
