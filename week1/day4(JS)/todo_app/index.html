<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-container">
    <header>
      <h1>Todos</h1>
    </header>

    <!-- Input Section -->
    <div class="input-section">
      <input 
        type="text" 
        id="todoInput" 
        placeholder="What needs to be done?" 
        autofocus 
      />
      <button id="addBtn">Add</button>
    </div>

    <!-- Filter Buttons (All, Active, Done) -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <!-- Task List (Rendered dynamically by JavaScript) -->
    <ul id="todoList" class="todo-list"></ul>

    <!-- Footer Summary & Actions -->
    <footer class="todo-footer" id="todoFooter">
      <span id="itemsLeft">0 tasks left</span>
      <button id="clearCompletedBtn" class="clear-btn">Clear completed</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
